[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typetrace"
# Tracks the record "schema_version" emitted in main.WATERMARK, so a dataset can
# be traced back to the generator release that produced it.
version = "2.0.0"
description = "Offline generator of synthetic writing-process datasets for detector training"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Project TypeTrace" }]
keywords = [
    "keystroke-dynamics",
    "synthetic-data",
    "writing-process",
    "academic-integrity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# numpy is the only third-party import in the package: timing_engine draws from a
# per-instance np.random.Generator.
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Mirrored by requirements-dev.txt for environments that install from
# requirements files. Keep the two in step.
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
# Optional emitters, used only by "python main.py --emit ...". The generator
# itself imports neither.
docs = [
    "playwright>=1.40",
]
desktop = [
    "pynput>=1.7",
]

[project.urls]
Homepage = "https://github.com/ahscolan2/typetrace"

[project.scripts]
# main.main returns an exit code, which is exactly what console_scripts expects.
typetrace = "main:main"

[tool.setuptools]
# The package is a set of flat modules at the repository root rather than a
# package directory, so that "python main.py" from a checkout keeps working
# unchanged. py-modules preserves that layout when installed.
py-modules = [
    "benchmark",
    "desktop_emitter",
    "docs_emitter",
    "emit_common",
    "error_models",
    "gui",
    "macro_scripter",
    "main",
    "pipeline",
    "replay",
    "timing_engine",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
python_files = ["test_*.py"]
markers = [
    # Statistical tests that need enough samples (or enough seeds) to be
    # stable. They are part of the default run; the marker exists so a quick
    # iteration loop can skip them with -m "not slow".
    "slow: statistical test over many samples or seeds",
]
# The flat-module layout means tests import macro_scripter, pipeline and friends
# directly. Stating the root explicitly keeps that working from a tests/
# subdirectory as well as from the root.
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "datasets",
    "__pycache__",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The rules that flag genuine defects - syntax errors, undefined names, unused
# imports and variables, broken comparisons, f-strings with no placeholders -
# rather than style. Deliberately not the full default set: E501 line-length
# and the flake8-bugbear opinions are style calls, and a lint gate that is red
# on a clean checkout teaches everyone to ignore it.
#
# This is wider than the previous ["E9", "F63", "F7", "F82"], which caught
# syntax errors and little else. The whole of pyflakes (F) is clean on this
# tree, so there is no cost to switching it on and it catches the dead import
# and the unused local that the narrow set let through.
select = ["E4", "E7", "E9", "F"]
